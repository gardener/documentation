name: Aggregate Documentation Content

on:
  push:
    branches: [master]
    paths:
      - '.docforge/**'
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

# Default: read-only. Jobs override with the minimum they need.
permissions:
  contents: read

concurrency:
  group: aggregate-content
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # build: runs docforge + post-processing + VitePress build.
  # No write credentials, no id-token — hostile content cannot exfiltrate secrets.
  # ----------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only; no id-token, no pull-requests
    outputs:
      build-outcome: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false   # no token written to .git/config

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # No cache: pnpm — prevents token-based cache writes in the untrusted job

      - name: Install deps
        run: make ci-install

      - name: Remove managed banner files
        run: ./delete-managed-banner.sh --force hugo/content

      # Docforge primarily reads via raw.githubusercontent.com which does not
      # consume GitHub API rate limits. The default GITHUB_TOKEN authenticates
      # the smaller number of metadata API calls.
      - name: Aggregate (docforge)
        env:
          DOCFORGE_CONFIG: .docforge/config.yaml
          GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make docforge-ci

      - name: Post-process
        run: make post-process

      - name: Build
        id: build
        run: make build
        continue-on-error: true

      - name: Upload content artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aggregated-content
          path: hugo/content
          # Keep artifact for 7 days so the publish job and any manual inspection
          # can access it even if the workflow is re-run.
          retention-days: 7

      # Ledger of post-processing changes, for analysing which transforms are
      # still needed. Separate artifact: it must not enter the content tree.
      - name: Upload post-processing report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: post-processing-report
          path: post-processing-report.json
          retention-days: 30

  # ----------------------------------------------------------------------------
  # publish: mints the federated write token and does git operations only.
  # Runs NO Node.js / pnpm / make — the build artefact is treated as untrusted
  # data; the job only commits and pushes it.
  # ----------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: build
    # Run only when the build job ran to the end and the `make build` step
    # actually executed (outcome success or failure). Two distinct failure
    # modes have to be told apart:
    #
    #   build.result == success, build-outcome == failure
    #     The `make build` step failed but is continue-on-error, so the job
    #     finished and uploaded the artifact. We want publish here: it opens
    #     the failure PR.
    #
    #   build.result == failure, build-outcome == skipped
    #     A step before `make build` (ci-install, docforge, post-process)
    #     failed, so `make build` never ran and no artifact exists. Skip
    #     publish: it would mint a write token for nothing, rm -rf the
    #     committed content and then fail on the missing artifact.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success","failure"]'), needs.build.outputs.build-outcome)
    permissions:
      id-token: write   # required by gardener/cc-utils/github-auth to mint OIDC token
      contents: read    # checkout

    steps:
      - name: Federated GitHub token
        uses: gardener/cc-utils/.github/actions/github-auth@bce63f62928717a11f610ec8022af9feb497d5df # v1
        id: app-token
        with:
          token-server: ${{ vars.FEDERATED_GITHUB_ACCESS_TOKEN_SERVER }}
          repositories: ${{ github.event.repository.name }}
          permissions: |
            contents: write
            pull-requests: write

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      # Remove committed content before download so that files deleted upstream
      # do not survive as stale artefacts (download-artifact overlays, not replaces).
      - name: Clear committed content
        run: rm -rf hugo/content

      - name: Download content artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aggregated-content
          path: hugo/content

      - name: Validate artifact
        run: |
          if find hugo/content -type l | grep -q .; then
            echo "Symlinks are not allowed in artifact"; exit 1
          fi
          if find hugo/content -type f ! \( \
            -name '*.md'          -o -name '*.yaml'        -o -name '*.yml'  -o \
            -name '*.html'        -o -name '*.json'        -o \
            -name '*.png'         -o -name '*.jpg'         -o -name '*.jpeg' -o \
            -name '*.gif'         -o -name '*.svg'         -o -name '*.webp' -o \
            -name '*.ico'         -o -name '*.webmanifest' -o \
            -name 'OWNERS' \
          \) | grep -q .; then
            echo "Unexpected file types in artifact"; exit 1
          fi

      # master is protected by a branch ruleset ("Changes must be made through
      # a pull request"), so content never lands via direct push. A single bot
      # branch is reset to the current master, the new content is committed onto
      # it with the signed-commit action (a GitHub API commit that is
      # cryptographically "Verified"), and one PR against master is opened or
      # updated. One branch on purpose: a success run overwrites a prior failure
      # PR (dropping its alarm title) and a failure run overwrites a mergeable
      # PR with the alarm, so the open PR always reflects the latest run.
      - name: Pick PR title and body
        id: pr
        env:
          OUTCOME: ${{ needs.build.outputs.build-outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = success ]; then
            echo "title=chore(content): aggregate docs" >> "$GITHUB_OUTPUT"
            echo "body=Automated content aggregation. Review the diff and merge." >> "$GITHUB_OUTPUT"
          else
            echo "title=🚨 Content aggregation build failed (run ${{ github.run_id }})" >> "$GITHUB_OUTPUT"
            echo "body=Daily content aggregation produced a tree that fails \`make build\`. Review the diff, fix the broken upstream source(s), then close this PR (next nightly run picks up the fix)." >> "$GITHUB_OUTPUT"
          fi

      # signed-commit commits server-side against the local HEAD (master), so the
      # bot branch only has to exist at master's tip; the local worktree is not
      # checked out onto it. The concurrency group serialises overlapping runs.
      - name: Reset bot branch to master
        run: |
          set -euo pipefail
          git push --force origin "HEAD:bot/content-aggregation"

      - name: Commit content (signed)
        id: signed
        uses: gardener/cc-utils/.github/actions/signed-commit@bce63f62928717a11f610ec8022af9feb497d5df # v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/content-aggregation
          message: "chore(content): aggregate docs ${{ github.run_id }}"
          paths: hugo/content

      # The force-push above already updated an open PR's diff. Sync its title and
      # body too (a success must drop a prior failure's alarm title and vice
      # versa), or open the PR if none exists. `gh pr edit` hits the deprecated
      # Projects-classic API on this repo, so patch via the REST endpoint.
      # ponytail: a success with no content change (empty diff -> no commit-sha)
      # skips this step and leaves a prior failure PR's alarm title stale; close
      # that PR here if the rare stale-alarm case ever matters.
      - name: Open or update PR
        if: steps.signed.outputs.commit-sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: ${{ steps.pr.outputs.title }}
          BODY: ${{ steps.pr.outputs.body }}
        run: |
          set -euo pipefail
          number="$(gh pr list --head bot/content-aggregation --base "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')"
          if [ -z "$number" ]; then
            gh pr create --base "$GITHUB_REF_NAME" --head bot/content-aggregation --title "$TITLE" --body "$BODY"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f title="$TITLE" -f body="$BODY"
          fi
