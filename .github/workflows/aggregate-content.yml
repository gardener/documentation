name: Aggregate Documentation Content

on:
  push:
    branches: [master]
    paths:
      - '.docforge/**'
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

# Default: read-only. Jobs override with the minimum they need.
permissions:
  contents: read

concurrency:
  group: aggregate-content
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # build: runs docforge + post-processing + VitePress build.
  # No write credentials, no id-token — hostile content cannot exfiltrate secrets.
  # ----------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only; no id-token, no pull-requests
    outputs:
      build-outcome: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false   # no token written to .git/config

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # No cache: pnpm — prevents token-based cache writes in the untrusted job

      - name: Install deps
        run: make ci-install

      - name: Remove managed banner files
        run: ./delete-managed-banner.sh --force hugo/content

      # Docforge primarily reads via raw.githubusercontent.com which does not
      # consume GitHub API rate limits. The default GITHUB_TOKEN authenticates
      # the smaller number of metadata API calls.
      - name: Aggregate (docforge)
        env:
          DOCFORGE_CONFIG: .docforge/config.yaml
          GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make docforge-ci

      - name: Post-process
        run: make post-process

      - name: Build
        id: build
        run: make build
        continue-on-error: true

      - name: Upload content artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aggregated-content
          path: hugo/content
          # Keep artifact for 7 days so the publish job and any manual inspection
          # can access it even if the workflow is re-run.
          retention-days: 7

  # ----------------------------------------------------------------------------
  # publish: mints the federated write token and does git operations only.
  # Runs NO Node.js / pnpm / make — the build artefact is treated as untrusted
  # data; the job only commits and pushes it.
  # ----------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: build
    # Run only when the build job ran to the end and the `make build` step
    # actually executed (outcome success or failure). Two distinct failure
    # modes have to be told apart:
    #
    #   build.result == success, build-outcome == failure
    #     The `make build` step failed but is continue-on-error, so the job
    #     finished and uploaded the artifact. We want publish here: it opens
    #     the failure PR.
    #
    #   build.result == failure, build-outcome == skipped
    #     A step before `make build` (ci-install, docforge, post-process)
    #     failed, so `make build` never ran and no artifact exists. Skip
    #     publish: it would mint a write token for nothing, rm -rf the
    #     committed content and then fail on the missing artifact.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success","failure"]'), needs.build.outputs.build-outcome)
    permissions:
      id-token: write   # required by gardener/cc-utils/github-auth to mint OIDC token
      contents: read    # checkout

    steps:
      - name: Federated GitHub token
        uses: gardener/cc-utils/.github/actions/github-auth@3d292cfb4cfee523f83e6306b892d963fde06392 # v1
        id: app-token
        with:
          token-server: ${{ vars.FEDERATED_GITHUB_ACCESS_TOKEN_SERVER }}
          repositories: ${{ github.event.repository.name }}
          permissions: |
            contents: write
            pull-requests: write

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      # Remove committed content before download so that files deleted upstream
      # do not survive as stale artefacts (download-artifact overlays, not replaces).
      - name: Clear committed content
        run: rm -rf hugo/content

      - name: Download content artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aggregated-content
          path: hugo/content

      - name: Validate artifact
        run: |
          if find hugo/content -type l | grep -q .; then
            echo "Symlinks are not allowed in artifact"; exit 1
          fi
          if find hugo/content -type f ! \( \
            -name '*.md'          -o -name '*.yaml'        -o -name '*.yml'  -o \
            -name '*.html'        -o -name '*.json'        -o \
            -name '*.png'         -o -name '*.jpg'         -o -name '*.jpeg' -o \
            -name '*.gif'         -o -name '*.svg'         -o -name '*.webp' -o \
            -name '*.ico'         -o -name '*.webmanifest' -o \
            -name 'OWNERS' \
          \) | grep -q .; then
            echo "Unexpected file types in artifact"; exit 1
          fi

      - name: Push on success
        if: needs.build.outputs.build-outcome == 'success'
        run: |
          git config user.name  "federated-github-access[bot]"
          git config user.email "248678271+federated-github-access[bot]@users.noreply.github.com"
          git add hugo/content/
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "chore(content): aggregate docs $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Open PR on failure
        if: needs.build.outputs.build-outcome == 'failure'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/content-aggregation-failure
          title: "🚨 Content aggregation build failed (run ${{ github.run_id }})"
          body: |
            Daily content aggregation produced a tree that fails `make build`.

            **Action required:** review the diff, fix the broken upstream source(s),
            then close this PR (next nightly run will pick up the fix).
          commit-message: "chore(content): aggregation with build failure"
          add-paths: hugo/content/
